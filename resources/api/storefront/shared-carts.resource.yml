resource:
    name: SharedCarts
    shortName: shared-carts
    description: 'Shared cart permissions for company users'

    processor: Spryker\Glue\SharedCartsRestApi\Api\Storefront\Processor\SharedCartsStorefrontProcessor

    security: "is_granted('ROLE_CUSTOMER')"

    paginationEnabled: false

    operations:
        - type: Post
          uriTemplate: '/carts/{cartId}/shared-carts'
          uriVariables:
              cartId:
                  identifiers: [cartId]
          openapiContext:
              responses:
                  201:
                      description: 'Cart shared with the company user.'
                  400:
                      description: 'Request body missing or not decodable.'
                  403:
                      description: 'Sharing is forbidden — cart not owned, or company user from a different company.'
                  404:
                      description: 'Cart or company user not found.'
                  422:
                      description: 'Validation failed or sharing failed.'

        - type: Patch
          uriTemplate: '/shared-carts/{uuid}'
          uriVariables:
              uuid:
                  identifiers: [uuid]
          read: false
          openapiContext:
              responses:
                  200:
                      description: 'Permission group updated.'
                  400:
                      description: 'Request body not decodable.'
                  403:
                      description: 'Unauthorized request.'
                  404:
                      description: 'Shared cart not found.'
                  422:
                      description: 'Validation failed or permission group not found.'

        - type: Delete
          uriTemplate: '/shared-carts/{uuid}'
          uriVariables:
              uuid:
                  identifiers: [uuid]
          read: false
          openapiContext:
              responses:
                  204:
                      description: 'Shared cart removed.'
                  403:
                      description: 'Unauthorized request.'
                  404:
                      description: 'Shared cart not found.'

    includes:
        - relationshipName: cart-permission-groups
          targetResource: CartPermissionGroups
          resolverClass: Spryker\Glue\CartPermissionGroupsRestApi\Api\Storefront\Relationship\SharedCartsCartPermissionGroupsRelationshipResolver

        - relationshipName: company-users
          targetResource: CompanyUsers
          uriTemplate: /company-users/{uuid}
          uriVariableMappings:
              idCompanyUser: uuid

    properties:
        uuid:
            type: string
            identifier: true
            writable: false
            readable: true
            required: false
            description: 'Unique shared cart identifier'
            openapiContext:
                example: '3fec586e-92f6-5692-a98b-dfca29cd2e16'

        cartId:
            type: string
            writable: false
            readable: false
            required: false
            description: 'Parent cart UUID, taken from the URL.'
            openapiContext:
                example: '1ce91011-8d60-59ef-9fe0-4493ef36c4f0'

        idCompanyUser:
            type: string
            writable: true
            readable: true
            required: false
            description: 'Company user UUID the cart is shared with'
            openapiContext:
                example: '8a14ba51-3fd1-5b35-9b75-f7d1bf09c0c8'

        idCartPermissionGroup:
            type: integer
            writable: true
            readable: true
            required: true
            description: 'Identifier of the cart permission group granted to the company user. Required for both POST and PATCH.'
            openapiContext:
                example: 1

        cartPermissionGroup:
            type: CartPermissionGroupsStorefrontResource
            writable: false
            readable: true
            required: false
            serializedName: cart-permission-groups
            description: 'Cart permission group granted to the company user'
